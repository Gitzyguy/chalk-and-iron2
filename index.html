<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Offline 5/3/1 workout tracker">
<title>Chalk &amp; Iron</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#15161a; --panel:#1d1e23; --panel2:#26272d; --line:#33343a;
  --text:#eeece4; --dim:#9a9ca3; --rust:#d2551a; --rust-dim:#8a3009;
  --green:#5f9c70; --red:#c0544a; --gold:#d9a441;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(10px + var(--safe-t)) 14px calc(150px + var(--safe-b))}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0;font-weight:800;letter-spacing:.12em;font-size:13px}
.brand i{display:inline-block;width:20px;height:14px;position:relative}
.brand i:before,.brand i:after{content:"";position:absolute;top:0;width:5px;height:14px;background:var(--rust);border-radius:1px}
.brand i:before{left:0}.brand i:after{right:0}
.brand b{position:absolute;left:4px;right:4px;top:5px;height:4px;background:var(--text)}
.top .sp{flex:1}
.pill{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .pill{max-width:46vw}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust);font-weight:700}
h1{font-size:26px;margin:2px 0 2px;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:17px;margin:0}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:20px 2px 8px}
.sub{color:var(--dim);font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:7px}
a.btn{color:var(--text)}
.dayin{flex:1;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:15px}
.link{background:none;border:none;color:var(--rust);padding:4px 0;font-weight:600}
.exname{background:none;border:none;padding:0;text-align:left;font-weight:700;font-size:19px;color:var(--text);display:flex;align-items:center;gap:6px}
.exname:after{content:"\203A";color:var(--dim);font-size:20px;line-height:1}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--rust-dim);color:#fff;text-transform:uppercase}
.tag.up{background:#2f5a3a}.tag.gold{background:#6b5016}
.meta{font-size:14px;color:var(--dim);margin:4px 0 8px;line-height:1.5}
.chipbtn{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--text);margin-left:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) 70px 54px 46px;gap:6px;align-items:center;padding:8px 4px;margin:0 -4px;border-top:1px dashed var(--line);border-radius:8px}
.set.next{background:rgba(210,85,26,.10);box-shadow:inset 3px 0 0 var(--rust)}
.set.done .num[readonly]{background:transparent;border-color:transparent;color:var(--dim)}
.set.warm{opacity:.72}
.set .lbl{font-size:12px;color:var(--dim);text-transform:uppercase;font-weight:700}
.set .tgt{font-size:17px;min-width:0}
.set .tgt b{font-family:var(--mono);font-size:19px}
.set .tgt b.need{color:var(--gold)}
.set .plates{grid-column:2/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px;color:var(--text);opacity:.85;font-family:var(--mono);margin-top:-2px;white-space:normal;line-height:1.35}
.set .plates .link{font-family:var(--font);font-size:14px;padding:2px 0 2px 10px}
.num{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 4px;text-align:center;font-family:var(--mono);font-size:18px}
.num:focus,.field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--rust);outline-offset:-1px}
.chk{width:46px;height:46px;border-radius:9px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#10140f}
.exfoot{display:flex;gap:8px;margin-top:8px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.field input,.field select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .it:first-child{border-top:0}
.list .it .grow{flex:1;min-width:0}
.list .it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:12px}
.toggle:first-child{border-top:0}
.sw{width:48px;height:28px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);position:relative;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:left .15s}
.sw.on{background:var(--rust-dim);border-color:var(--rust)}.sw.on:after{left:23px;background:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(29,30,35,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safe-b));z-index:30}
nav .in{display:flex;width:100%;max-width:520px}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--rust)}
#rest{position:fixed;left:0;right:0;bottom:calc(62px + var(--safe-b));z-index:29;display:none;justify-content:center}
#rest.show{display:flex}
#rest .in{width:100%;max-width:520px;margin:0 10px 6px;background:var(--panel2);border:1px solid var(--rust);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
#rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--rust)}
#rest .time{font-family:var(--mono);font-size:22px;font-weight:700;flex:1;min-width:64px}
#rest .eff{display:flex;gap:3px}#rest .eff button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 6px;font-size:12px;font-weight:700;color:var(--dim)}
#rest .eff button.on{background:var(--rust);border-color:var(--rust);color:#fff}#rest .eff.hide{display:none}
#rest .btn.sm{padding:5px 8px}
#rest .time small{font-size:11px;color:var(--dim);font-family:var(--font);font-weight:600;letter-spacing:.08em;margin-left:6px;text-transform:uppercase}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:520px;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;padding:14px 14px calc(22px + var(--safe-b))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .hd h2{flex:1}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--rust);border-radius:10px;padding:10px 16px;z-index:80;font-size:14px;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1;pointer-events:auto}
.banner{background:#2a2216;border:1px solid #6b5016;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:10px}
.banner .grow{flex:1}
.empty{text-align:center;color:var(--dim);padding:36px 16px;line-height:1.5}
.stat{background:var(--panel2);border-radius:9px;padding:9px 10px}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:700}
.stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.hist-sets{margin-top:6px;line-height:1}
.hs{display:inline-block;background:var(--panel2);border:1px solid #44454c;border-radius:7px;padding:5px 8px;margin:3px 5px 3px 0;font-family:var(--mono);font-size:14px;color:var(--dim);white-space:nowrap}
.hs b{color:#fff;font-size:16.5px}
.hs.a{border-color:var(--gold);background:rgba(217,164,65,.12)}.hs.a b{color:var(--gold)}
.hs.top{border-color:var(--rust)}
.hl{color:var(--gold);font-weight:700;font-family:var(--mono)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font-size:10px;font-family:var(--mono)}
.edrow{display:grid;grid-template-columns:1fr 46px 46px 46px 30px;gap:5px;align-items:center;margin-bottom:6px}
.edrow .nm{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px;text-align:left;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edrow input{padding:7px 2px;font-size:14px}
.edhead{display:grid;grid-template-columns:1fr 46px 46px 46px 30px;gap:5px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.ib{background:none;border:0;color:var(--dim);font-size:18px;padding:2px}
.daycard .hdr{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.daycard .hdr input{flex:1;font-weight:700}
.plategrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.plategrid .field{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{border-color:var(--rust);background:rgba(210,85,26,.18);color:#fff}
.platevis{display:flex;align-items:center;gap:2px;height:46px;margin:8px 0 2px}
.platevis .sl{width:16px;height:6px;background:var(--dim);border-radius:2px;margin-right:2px}
.platevis .p{border-radius:2px;background:var(--rust)}
.platevis .p.b{background:#3a3b42;border:1px solid #5a5b63}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.mono{font-family:var(--mono)}
.right{text-align:right}
.mt{margin-top:10px}
.small{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"><div class="in"><div class="bar" id="restBar"></div><div class="time" id="restTime">0:00</div><div class="eff" id="restEff"><button data-eff="easy">Easy</button><button data-eff="hard">Hard</button><button data-eff="fail">Fail</button></div><button class="btn sm" data-act="restAdd">+30</button><button class="btn sm" data-act="restSkip">Skip</button></div></div>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =========================================================================
   Chalk & Iron v3. Offline 5/3/1 tracker. All data stays on this device.
   ========================================================================= */
const APP_VERSION = '3.6.0';
const DB_NAME = 'chalk-and-iron', DB_STORE = 'kv', STATE_KEY = 'state';

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const fmtW = w => (w == null ? '' : (Math.round(w * 10) / 10).toString());
const e1rm = (w, r) => (!w || !r) ? 0 : (r === 1 ? w : w * (1 + r / 30));
const DAY = 86400000;
function fmtDate(ts, opts) { return new Date(ts).toLocaleDateString(undefined, opts || {month: 'short', day: 'numeric', year: 'numeric'}); }
function fmtShort(ts) { const d = new Date(ts), now = new Date(); return d.toLocaleDateString(undefined, d.getFullYear() === now.getFullYear() ? {weekday:'short', month:'short', day:'numeric'} : {month:'short', day:'numeric', year:'numeric'}); }
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 2200); }

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const store = {
  db: null,
  async open() {
    if (this.db || !window.indexedDB) return this.db;
    this.db = await new Promise(res => {
      try {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return this.db;
  },
  async get(k) {
    const db = await this.open();
    if (db) {
      const v = await new Promise(res => {
        try { const r = db.transaction(DB_STORE).objectStore(DB_STORE).get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }
        catch (e) { res(undefined); }
      });
      if (v !== undefined) return v;
    }
    try { const s = localStorage.getItem(DB_NAME + ':' + k); return s ? JSON.parse(s) : undefined; } catch (e) { return undefined; }
  },
  async set(k, v) {
    const db = await this.open();
    if (db) {
      const ok = await new Promise(res => {
        try { const tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }
        catch (e) { res(false); }
      });
      if (ok) return true;
    }
    try { localStorage.setItem(DB_NAME + ':' + k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
};

/* ---------- state ---------- */
const EQUIP = {barbell:'Barbell', hex:'Hex bar', ez:'EZ bar', dumbbell:'Dumbbell', cable:'Cable', machine:'Machine', bodyweight:'Bodyweight'};
const PLATE_EQUIP = {barbell:'barbell', hex:'hex', ez:'ez'};
const DEFAULT_INC = {barbell:5, hex:10, ez:5, dumbbell:5, cable:5, machine:10, bodyweight:0};
const WAVE = [
  {name:'Week 1', scheme:'5/5/5+', sets:[[.65,5],[.75,5],[.85,5,1]]},
  {name:'Week 2', scheme:'3/3/3+', sets:[[.70,3],[.80,3],[.90,3,1]]},
  {name:'Week 3', scheme:'5/3/1+', sets:[[.75,5],[.85,3],[.95,1,1]]},
  {name:'Week 4', scheme:'Deload', sets:[[.40,5],[.50,5],[.60,5]], deload:true}
];
const WARMUP = [[.40,5],[.50,5],[.60,3]];

function defaultSettings() {
  return {
    bars: {barbell:45, ez:15, hex:45},
    plates: {iron:{'45':4,'35':2,'25':2,'10':2,'5':4,'2.5':2}, bumper:{'45':2,'35':2,'25':2,'15':2,'10':2}},
    pin: {'45':4,'35':2,'25':2,'10':2,'5':4,'2.5':2},
    rest: {warm:60, main:{easy:90, hard:180, fail:300}, acc:{easy:45, hard:60, fail:90}, def:'easy'},
    warmups: true, deloadAcc: true, awake: true, sound: true, round: 5, lastBackup: null,
    lockDone: true, autoNext: true, volume: 'loud'
  };
}
function blankState() {
  return {app:'chalk-and-iron', schema:3, exercises:{}, programs:{}, active:null, pos:{}, sessions:[], settings:defaultSettings(), live:null, dirtySinceBackup:0, body:defaultBody()};
}
let S = null;               // app state
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const run = () => store.set(STATE_KEY, S).then(ok => { if (!ok) toast('Could not save. Storage may be full.'); });
  if (now) return run();
  saveTimer = setTimeout(run, 250);
}
function normalize(st) {
  const base = blankState();
  const out = Object.assign(base, st || {});
  out.settings = Object.assign(defaultSettings(), st && st.settings || {});
  out.settings.bars = Object.assign(defaultSettings().bars, out.settings.bars || {});
  const r0 = out.settings.rest || {}, dr = defaultSettings().rest;
  out.settings.rest = {warm:r0.warm != null ? r0.warm : dr.warm, def:r0.def || dr.def,
    main:Object.assign({}, dr.main, typeof r0.main === 'object' ? r0.main : {}), acc:Object.assign({}, dr.acc, typeof r0.acc === 'object' ? r0.acc : {})};
  if (!out.settings.plates || !out.settings.plates.iron) out.settings.plates = defaultSettings().plates;
  if (!st || !st.settings || !st.settings.pin) out.settings.pin = Object.assign({}, out.settings.plates.iron);
  /* 3.5: rest timer starts on Easy by default (older versions saved Hard) */
  if (!out.settings.mig35) { if (out.settings.rest.def === 'hard') out.settings.rest.def = 'easy'; out.settings.mig35 = 1; }
  const bd = st && st.body && !Array.isArray(st.body) ? st.body : {};
  out.body = Object.assign(defaultBody(), bd);
  ['weights', 'waist', 'intake', 'phases'].forEach(k => { if (!Array.isArray(out.body[k])) out.body[k] = []; });
  out.body.targets = Object.assign(defaultBody().targets, bd.targets || {});
  out.body.goal = Object.assign(defaultBody().goal, bd.goal || {});
  out.exercises = out.exercises || {}; out.programs = out.programs || {}; out.pos = out.pos || {};
  out.sessions = (out.sessions || []).filter(s => s && s.ex).sort((a, b) => b.date - a.date);
  for (const id in out.programs) {
    const p = out.programs[id];
    p.days = p.days || []; p.tm = p.tm || {}; p.tmInc = p.tmInc || {};
    if (!out.pos[id]) out.pos[id] = {week:0, day:0, cycle:1};
  }
  if (out.active && !out.programs[out.active]) out.active = Object.keys(out.programs)[0] || null;
  seedLibrary(out);
  return out;
}

/* ---------- exercises ---------- */
const exName = id => (S.exercises[id] && S.exercises[id].name) || 'Unknown exercise';
function findExByName(name) {
  const n = name.trim().toLowerCase();
  return Object.values(S.exercises).find(e => e.name.trim().toLowerCase() === n) || null;
}
function createExercise(name, equip) {
  const ex = findExByName(name);
  if (ex) return ex;
  let id = 'x_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  if (!id || id === 'x_' || S.exercises[id]) id = uid('x_');
  S.exercises[id] = {id, name:name.trim(), equip:equip || 'dumbbell', inc:DEFAULT_INC[equip || 'dumbbell'], floor:false, notes:'', video:''};
  return S.exercises[id];
}
/* every logged set for an exercise, newest session first */
function exHistory(exId) {
  const out = [];
  for (const s of S.sessions) for (const e of s.ex) if (e.ex === exId) {
    const work = e.sets.filter(x => !x.warm);
    if (work.length) out.push({session:s, sets:work});
  }
  return out;
}

/* Move all history and program slots from one exercise to another (used for renames from older imports). */

  Object.values(st.programs).forEach(p => { p.days.forEach(d => { if (d.main === from) d.main = to; d.items.forEach(i => { if (i.ex === from) i.ex = to; }); });
    if (p.tm[from] != null && p.tm[to] == null) p.tm[to] = p.tm[from]; delete p.tm[from]; if (p.tmInc[from] != null && p.tmInc[to] == null) p.tmInc[to] = p.tmInc[from]; delete p.tmInc[from]; });
  if (st.live) st.live.ex.forEach(e => { if (e.ex === from) e.ex = to; });

  if ((st.libVersion || 0) >= LIB_VERSION) return;
  const byName = {};
  Object.values(st.exercises).forEach(e => { byName[e.name.trim().toLowerCase()] = e; });
  for (const [oldN, newN] of Object.entries(RENAMES)) {
    const o = byName[oldN]; if (!o) continue;
    const n = byName[newN.toLowerCase()];
    if (n && n.id !== o.id) { remapEx(st, n.id, o.id); }
    o.name = newN; delete byName[oldN]; byName[newN.toLowerCase()] = o;

    const ex = byName[name.toLowerCase()];
    if (ex) { if (!ex.notes) ex.notes = cue; if (!ex.video && VIDEO_DEFAULTS[name]) ex.video = VIDEO_DEFAULTS[name]; continue; }
    let id = 'x_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

    st.exercises[id] = {id, name, equip, inc:DEFAULT_INC[equip], floor:!!floor, notes:cue, video:VIDEO_DEFAULTS[name] || ''};
  }
  st.libVersion = LIB_VERSION;

function installTemplate(t) {
  const idFor = name => { const ex = findExByName(name) || createExercise(name, (LIBRARY.find(l => l[0] === name) || [0, 'dumbbell'])[1]); return ex.id; };
  const id = uid('p_');
  const p = {id, name:t.name, wave:!!t.wave, days:[], tm:{}, tmInc:{}, template:t.id};
  t.plan.forEach(d => {
    const day = {name:d.name, main:d.main ? idFor(d.main) : null, items:[]};
    d.items.forEach(it => {
      const o = {ex:idFor(it.ex), sets:it.sets || 1, min:it.min || 1, max:it.max || 1};
      if (it.t) o.type = it.t; if (it.pct) o.pct = it.pct; if (it.a) o.amrap = true; if (it.w) o.warm = true; if (it.inc != null) o.inc = it.inc;
      day.items.push(o);
    });
    p.days.push(day);
  });
  /* carry over training maxes you already have for the same lifts */
  const known = {};
  Object.values(S.programs).forEach(q => Object.entries(q.tm || {}).forEach(([k, v]) => { if (v && !known[k]) known[k] = v; }));
  if (S.active && S.programs[S.active]) Object.entries(S.programs[S.active].tm || {}).forEach(([k, v]) => { if (v) known[k] = v; });
  tmLifts(p).forEach(k => { if (known[k]) p.tm[k] = known[k]; p.tmInc[k] = /dead|squat/i.test(exName(k)) ? 10 : 5; });
  S.programs[id] = p; S.pos[id] = {week:0, day:0, cycle:1};
  return p;
}

const TM_TYPES = {'531':1, fsl:1, bbb:1};
const ITEM_TYPES = {reps:'Rep range (double progression)', '531':'5/3/1 main lift (training max wave)', fsl:'First Set Last (5/3/1 supplemental)', bbb:'Fixed % of training max (BBB style)'};
/* every lift in a program that needs a training max */
function tmLifts(p) {
  const out = [];
  p.days.forEach(d => { if (d.main && p.wave && !out.includes(d.main)) out.push(d.main); d.items.forEach(i => { if (TM_TYPES[i.type] && !out.includes(i.ex)) out.push(i.ex); }); });
  return out;
}
function waveLifts(p) {
  const out = [];
  p.days.forEach(d => { if (d.main && p.wave && !out.includes(d.main)) out.push(d.main); d.items.forEach(i => { if (i.type === '531' && !out.includes(i.ex)) out.push(i.ex); }); });
  return out;
}
const isDeload = (p, week) => !!(p.wave && WAVE[week] && WAVE[week].deload);
function buildSets531(p, exId, week) {
  const tm = p.tm[exId];
  const wv = WAVE[week];
  const ex = S.exercises[exId];
  const sets = [];
  if (!tm) return sets;
  const bar = barWeight(ex) || 45;
  if (S.settings.warmups && !wv.deload) WARMUP.forEach(([pct, reps], i) => sets.push({lbl:'W' + (i + 1), tw:loadable(Math.max(bar, roundLoad(tm * pct)), ex), tr:reps, warm:true, pct}));
  wv.sets.forEach(([pct, reps, amrap], i) => sets.push({lbl:String(i + 1), tw:loadable(Math.max(bar, roundLoad(tm * pct)), ex), tr:reps, amrap:!!amrap, pct}));
  return sets;
}
/* Ramp-up warmups for straight-set barbell work: empty bar, then about 40/60/80% of the working weight. */
function rampWarmups(ex, work) {
  const bar = barWeight(ex);
  if (!bar || !work || work < bar + 40) return [];
  const out = [{lbl:'W1', tw:bar, tr:5, warm:true}];
  [[.4, 5], [.6, 3], [.8, 2]].forEach(([pc, r]) => { const w = roundLoad(work * pc); if (w > out[out.length - 1].tw && w < work) out.push({lbl:'W' + (out.length + 1), tw:w, tr:r, warm:true}); });
  return out;
}
/* Double progression: when every set last time hit the top of the range, the weight goes up one step.
   If your last session used a very different rep range (5s vs 10s), the weight is estimated from that set instead.
   Straight-set programs with an AMRAP last set reset about 10% after missing reps two sessions in a row. */
function suggestion(item) {
  const ex = S.exercises[item.ex];
  const hist = exHistory(item.ex), last = hist[0];
  if (item.next) return {w:item.next, up:false, last, set:true};
  if (!last) return {w:item.start != null ? item.start : null, up:false, last:null};
  const inc = item.inc != null ? item.inc : ex && ex.inc != null ? ex.inc : DEFAULT_INC[ex ? ex.equip : 'dumbbell'];
  const step = inc > 0 ? inc : 2.5;
  const w = Math.max(...last.sets.map(s => s.w || 0));
  const top = last.sets.filter(s => (s.w || 0) === w);
  const avgR = top.reduce((a, s) => a + s.r, 0) / top.length;
  if (w > 0 && (avgR > item.max + 3 || avgR < item.min - 3)) {
    const best = Math.max(...last.sets.map(s => e1rm(s.w, s.r)));
    const est = Math.floor(best / (1 + item.max / 30) / step) * step;
    return {w:Math.max(barWeight(ex) || 0, est), up:false, last, est:true};
  }
  const hitAll = top.length >= Math.min(item.sets, last.sets.length) && top.every(s => s.r >= item.max);
  if (hitAll && inc > 0) return {w:w + inc, up:true, last};
  if (item.amrap && item.min === item.max && hist[1]) {
    const w2 = Math.max(...hist[1].sets.map(s => s.w || 0));
    const missed = h => h.sets.some(s => s.r < item.max);
    if (w2 === w && missed(last) && missed(hist[1])) return {w:Math.max(barWeight(ex) || 0, Math.floor(w * 0.9 / step) * step), up:false, last, reset:true};
  }
  return {w:w || (item.start != null ? item.start : null), up:false, last};
}
const liveSet = (s) => Object.assign(s, {w:s.tw, r:null, done:false});

function buildEntries(p, d, week) {
  const ex = [];
  const deload = isDeload(p, week);
  if (d.main && p.wave) ex.push({ex:d.main, kind:'main', main:true, sets:buildSets531(p, d.main, week).map(liveSet)});
  else if (d.main) d = Object.assign({}, d, {items:[{ex:d.main, sets:3, min:5, max:5, warm:true}].concat(d.items)});

/* ---------- sheets ---------- */
function sheet(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(bg); });
  document.body.appendChild(bg);
  history.pushState({sheet:true}, '');
  if (onMount) onMount(bg);
  return bg;
}
let skipPop = 0;
function closeSheet(bg) {
  bg = bg || [...document.querySelectorAll('.sheet-bg')].pop();
  if (!bg) return;
  bg.remove();
  if (history.state && history.state.sheet) { skipPop++; history.back(); }
}
/* Android back button closes the top sheet instead of leaving the app */
window.addEventListener('popstate', () => {
  if (skipPop > 0) { skipPop--; return; }
  const bg = [...document.querySelectorAll('.sheet-bg')].pop(); if (bg) bg.remove();
});

function openExercise(exId) {
  const ex = S.exercises[exId]; if (!ex) return;
  const hist = exHistory(exId);
  const weighted = hist.some(h => h.sets.some(s => s.w > 0));
  let best = {e:0}, heavy = {w:0}, reps = {r:0};
  const pts = [];
  hist.slice().reverse().forEach(hh => {
    let se = 0, sr = 0;
    hh.sets.forEach(s => {
      const v = e1rm(s.w, s.r);
      if (v > best.e) best = {e:v, s, d:hh.session.date};
      if ((s.w || 0) > heavy.w) heavy = {w:s.w, r:s.r, d:hh.session.date};
      if (s.r > reps.r) reps = {r:s.r, w:s.w, d:hh.session.date};
      se = Math.max(se, v); sr += s.r || 0;
    });
    pts.push({d:hh.session.date, v:weighted ? se : sr});

  if (pts.length > 1) h += `<div class="card"><div class="eyebrow">${weighted ? 'Estimated 1 rep max' : 'Total reps per session'}</div>${chart(pts.slice(-60))}</div>`;
  if (hist.length) h += `<div class="grid3" style="margin-bottom:12px">${weighted ? `<div class="stat"><div class="v">${Math.round(best.e)}</div><div class="k">Best e1RM</div></div><div class="stat"><div class="v">${fmtW(heavy.w)}</div><div class="k">Heaviest</div></div>` : ''}<div class="stat"><div class="v">${reps.r}</div><div class="k">Most reps</div></div></div>`;
  if (ex.video) h += ytId(ex.video) ? `<button class="btn block" style="margin-bottom:12px" data-act="playVideo" data-ex="${esc(exId)}">Watch form video</button>` : `<a class="btn block" style="margin-bottom:12px;text-decoration:none" href="${esc(ex.video)}" target="_blank" rel="noopener">Watch form video</a>`;
  else h += `<a class="btn block" style="margin-bottom:6px;text-decoration:none" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' proper form')}" target="_blank" rel="noopener">Find a form video on YouTube</a><div class="small" style="margin-bottom:12px">Found a good one? Copy its link, then tap Edit exercise below and paste it so it is saved here.</div>`;
  if (ex.notes) h += `<div class="card small" style="white-space:pre-wrap">${esc(ex.notes)}</div>`;
  h += `<h3>History</h3>`;

  else {

      h += `<div class="it" style="display:block"><div class="between"><b>${esc(fmtShort(hh.session.date))}</b><span class="small">${esc(hh.session.day)}</span></div>
        <div class="hist-sets">${setChips(hh.sets)}</div></div>`;

  }
  h += `<button class="btn block mt" data-act="editEx" data-ex="${esc(exId)}">Edit exercise</button>`;
  sheet(h);
}
function chart(pts) {
  const W = 320, H = 130, pl = 34, pr = 8, pt = 10, pb = 18;
  const vs = pts.map(p => p.v), min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1, t0 = pts[0].d, t1 = pts[pts.length - 1].d, ts = (t1 - t0) || 1;
  const x = d => pl + (W - pl - pr) * (d - t0) / ts, y = v => pt + (H - pt - pb) * (1 - (v - min) / span);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W - pr}" y1="${y(max)}" y2="${y(max)}" stroke="#33343a"/><line x1="${pl}" x2="${W - pr}" y1="${y(min)}" y2="${y(min)}" stroke="#33343a"/>
    <text x="2" y="${y(max) + 3}">${Math.round(max)}</text><text x="2" y="${y(min) + 3}">${Math.round(min)}</text>
    <text x="${pl}" y="${H - 3}">${esc(fmtDate(t0, {month:'short', year:'2-digit'}))}</text><text x="${W - pr}" y="${H - 3}" text-anchor="end">${esc(fmtDate(t1, {month:'short', year:'2-digit'}))}</text>
    <path d="${line}" fill="none" stroke="#d2551a" stroke-width="2"/>${pts.map(p => `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.2" fill="#eeece4"/>`).join('')}</svg>`;
}

function pickExercise(title, cb) {
  const bg = sheet(`<div class="hd"><h2>${esc(title)}</h2><button class="x" data-act="close">✕</button></div>
    <div class="field"><input id="pkQ" type="search" placeholder="Search or type a new name" autocomplete="off"></div><div class="card list" id="pkList"></div>`, bg => {

      let h = items.map(e => `<button class="it" data-pick="${esc(e.id)}"><div class="grow"><div class="t">${esc(e.name)}</div><div class="s">${EQUIP[e.equip] || ''}</div></div></button>`).join('');

function tmReviewSheet(p, cycle) {
  const mains = tmLifts(p);
  const rows = mains.map(m => {
    const amraps = [];
    S.sessions.filter(s => s.programId === p.id && s.cycle === cycle).forEach(s => s.ex.filter(e => e.ex === m).forEach(e => e.sets.filter(x => x.amrap).forEach(x => amraps.push(x))));

    const inc = p.tmInc[m] != null ? p.tmInc[m] : 5;

   Body: weigh-ins, trend weight, phases, maintenance estimate, abs range.

const PHASES = {

  maintain: {name:'Maintain', color:'#5f9c70', desc:'Hold your weight. Good for diet breaks, holidays and busy stretches.'},
  gain:     {name:'Lean gain', color:'#4f7fb8', desc:'Gain slowly so most of it is muscle.'},
  recomp:   {name:'Recomp', color:'#d9a441', desc:'Weight stays about the same while your waist shrinks and lifts go up.'}

const CUT_PACE = {0.005:'Gentle (0.5% a week)', 0.0075:'Standard (0.75% a week)', 0.01:'Fast (1% a week)'};
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function defaultBody() {
  return {weights:[], waist:[], intake:[], phases:[], targets:{train:2300, rest:2000, days:[1, 2, 4, 5]}, goal:{bfLow:12, bfHigh:15}, bfManual:null};
}
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dnum = s => Math.floor(Date.parse(s + 'T12:00:00Z') / DAY);   // day number for a YYYY-MM-DD string
const dstr = n => new Date(n * DAY + DAY / 2).toISOString().slice(0, 10);

const r25 = v => Math.round(v / 25) * 25;
let bodyLogDate = null, bodyShowAll = false;

/* Smoothed trend: each weigh-in moves the trend 10% per day toward the scale reading. */
function bodyTrend() {
  const ws = S.body.weights.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  const out = [];
  let t = null, last = null;
  for (const w of ws) {
    const n = dnum(w.d);
    if (t == null) t = w.lb;
    else { const a = 1 - Math.pow(0.9, Math.max(1, n - last)); t = t + a * (w.lb - t); }
    last = n;
    out.push({d:w.d, n, lb:w.lb, bf:w.bf, t});

/* Least-squares slope of the trend over the last `days` days, in lb per day. */
function trendSlope(tr, days) {

function intakeFor(n) {

function bodyChart(tr) {
  const end = tr[tr.length - 1].n, start = Math.max(tr[0].n, end - 120);
  const pts = tr.filter(p => p.n >= start);
  if (pts.length < 2) return '';
  const W = 320, H = 150, pl = 30, pr = 6, pt = 8, pb = 18;
  const vals = pts.flatMap(p => [p.lb, p.t]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const ar = absRange(tr);
  if (ar && ar.hi > lo - 8) lo = Math.min(lo, ar.hi - 1);
  const span = (hi - lo) || 1, xs = (end - start) || 1;
  const x = n => pl + (W - pl - pr) * (n - start) / xs, y = v => pt + (H - pt - pb) * (1 - (v - lo) / span);
  let svg = `<svg class="chart mt" viewBox="0 0 ${W} ${H}">`;
  S.body.phases.forEach((p, i) => {
    const a = Math.max(start, dnum(p.start)), b = i < S.body.phases.length - 1 ? Math.min(end, dnum(S.body.phases[i + 1].start)) : end;
    if (b > a) svg += `<rect x="${x(a).toFixed(1)}" y="${pt}" width="${(x(b) - x(a)).toFixed(1)}" height="${H - pt - pb}" fill="${PHASES[p.type].color}" opacity=".12"/>`;
  });
  if (ar) { const top = y(Math.min(ar.hi, hi)), bot = Math.min(H - pb, y(Math.max(ar.lo, lo))); if (bot > top + 1) svg += `<rect x="${pl}" y="${top.toFixed(1)}" width="${W - pl - pr}" height="${(bot - top).toFixed(1)}" fill="#5f9c70" opacity=".2"/><text x="${W - pr - 2}" y="${(top + 10).toFixed(1)}" text-anchor="end">abs range</text>`; }
  svg += `<text x="2" y="${y(hi) + 3}">${Math.round(hi)}</text><text x="2" y="${y(lo) + 3}">${Math.round(lo)}</text>`;
  svg += `<text x="${pl}" y="${H - 3}">${esc(fmtDate(dts(dstr(start)), {month:'short', day:'numeric'}))}</text><text x="${W - pr}" y="${H - 3}" text-anchor="end">${esc(fmtDate(dts(dstr(end)), {month:'short', day:'numeric'}))}</text>`;
  svg += pts.map(p => `<circle cx="${x(p.n).toFixed(1)}" cy="${y(p.lb).toFixed(1)}" r="2" fill="#9a9ca3" opacity=".75"/>`).join('');
  svg += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(p.n).toFixed(1) + ' ' + y(p.t).toFixed(1)).join(' ')}" fill="none" stroke="#d2551a" stroke-width="2.2"/></svg>`;
  return svg + `<div class="small">Dots are scale readings; the line is your trend. Shading shows each phase.</div>`;
}

/* ---------- backup / restore ---------- */
function exportData() {
  return {app:'chalk-and-iron', schema:3, version:APP_VERSION, exported:Date.now(), exercises:S.exercises, programs:S.programs, active:S.active, pos:S.pos, sessions:S.sessions, settings:S.settings, body:S.body};
}
async function backup() {
  const data = JSON.stringify(exportData());
  const name = 'chalk-and-iron-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([data], name, {type:'application/json'});
  let ok = false;
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Chalk & Iron backup'}); ok = true; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!ok) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); ok = true;
  }
  S.settings.lastBackup = Date.now(); S.dirtySinceBackup = 0; save(); render(); toast('Backup saved.');
}
/* Merge a backup into what is already here: nothing on this phone is overwritten or lost. */
function mergeData(d) {
  const map = {}, n = {ex:0, prog:0, sess:0, wt:0};
  const byName = {}; Object.values(S.exercises).forEach(e => { byName[e.name.trim().toLowerCase()] = e.id; });
  Object.values(d.exercises || {}).forEach(e => {
    const hit = byName[(e.name || '').trim().toLowerCase()];
    if (hit) { map[e.id] = hit; const cur = S.exercises[hit]; if (!cur.video && e.video) cur.video = e.video; return; }
    let id = e.id; if (S.exercises[id]) id = uid('x_');
    S.exercises[id] = Object.assign({}, e, {id}); map[e.id] = id; byName[e.name.trim().toLowerCase()] = id; n.ex++;
  });
  const mx = id => map[id] || id;
  Object.values(d.programs || {}).forEach(p => {
    if (S.programs[p.id]) return;
    const q = clone(p);
    q.days.forEach(day => { if (day.main) day.main = mx(day.main); day.items.forEach(i => { i.ex = mx(i.ex); }); });
    const rm = o => { const r = {}; Object.entries(o || {}).forEach(([k, v]) => { r[mx(k)] = v; }); return r; };
    q.tm = rm(q.tm); q.tmInc = rm(q.tmInc);
    S.programs[q.id] = q; S.pos[q.id] = (d.pos && d.pos[q.id]) || {week:0, day:0, cycle:1}; n.prog++;
  });
  const have = new Set(S.sessions.map(x => x.id));
  (d.sessions || []).forEach(x => { if (have.has(x.id)) return; const c = clone(x); c.ex.forEach(e => { e.ex = mx(e.ex); }); S.sessions.push(c); n.sess++; });
  S.sessions.sort((a, b) => b.date - a.date);
  if (d.body && !Array.isArray(d.body)) {
    const dates = new Set(S.body.weights.map(w => w.d));
    (d.body.weights || []).forEach(w => { if (!dates.has(w.d)) { S.body.weights.push(w); n.wt++; } });
    S.body.weights.sort((a, b) => a.d < b.d ? -1 : 1);
    const wd = new Set(S.body.waist.map(w => w.d)); (d.body.waist || []).forEach(w => { if (!wd.has(w.d)) S.body.waist.push(w); });
    const ws = new Set(S.body.intake.map(w => w.start)); (d.body.intake || []).forEach(w => { if (!ws.has(w.start)) S.body.intake.push(w); });
    if (!S.body.phases.length && d.body.phases) S.body.phases = d.body.phases;
  }
  if (!S.active) S.active = d.active && S.programs[d.active] ? d.active : Object.keys(S.programs)[0] || null;
  return n;
}
function restorePick() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let d;
    try {
      d = JSON.parse(await f.text());
      if (d.app !== 'chalk-and-iron' || !Array.isArray(d.sessions) || typeof d.exercises !== 'object') throw new Error('Not a Chalk & Iron backup');
    } catch (e) { toast('Could not read that file: ' + e.message, 3500); return; }
    const replace = async () => {
      const keepSettings = S.settings, keepBody = S.body;
      S = normalize(Object.assign(blankState(), d, {live:null}));
      if (!d.settings) S.settings = Object.assign(defaultSettings(), keepSettings);
      if (!d.body || Array.isArray(d.body)) S.body = keepBody;
      await save(true); tab = 'today'; render(); toast('Restored ' + S.sessions.length + ' workouts.');
    };
    const has = S.sessions.length || Object.keys(S.programs).length;
    if (!has) return replace();
    sheet(`<div class="hd"><h2>Import backup</h2><button class="x" data-act="close">✕</button></div>
      <p class="sub">This file has ${d.sessions.length} workouts and ${Object.keys(d.programs || {}).length} programs.</p>
      <button class="btn primary block" id="imMerge">Merge into what is here (recommended)</button>
      <div class="small" style="margin:6px 0 14px">Adds programs, exercises, workouts and weigh-ins you do not have yet. Nothing on this phone is changed or removed.</div>
      <button class="btn danger block" id="imReplace">Replace everything</button>
      <div class="small mt">Wipes this phone's data and uses only the file.</div>`, bg => {
      bg.querySelector('#imMerge').addEventListener('click', async () => {
        const n = mergeData(d); await save(true); closeSheet(bg); render();
        toast('Added ' + n.prog + ' programs, ' + n.sess + ' workouts, ' + n.ex + ' exercises' + (n.wt ? ', ' + n.wt + ' weigh-ins' : '') + '.', 4000);
      });
      bg.querySelector('#imReplace').addEventListener('click', async () => { if (!confirm('Erase what is on this phone and use only the file?')) return; closeSheet(bg); await replace(); });
    });
  };
  inp.click();
}

/* ---------- actions ---------- */
function freshProgram() {
  const lifts = [['Overhead Press', 'barbell'], ['Deadlift', 'barbell'], ['Bench Press', 'barbell'], ['Squat', 'barbell']];
  const ids = lifts.map(([n, e]) => { const x = createExercise(n, e); if (n === 'Deadlift') x.floor = true; return x.id; });
  const id = uid('p_');
  S.programs[id] = {id, name:'5/3/1', wave:true, days:['Press', 'Deadlift', 'Bench', 'Squat'].map((n, i) => ({name:n, main:ids[i], items:[]})), tm:{}, tmInc:{[ids[0]]:5, [ids[1]]:10, [ids[2]]:5, [ids[3]]:10}};
  S.pos[id] = {week:0, day:0, cycle:1}; S.active = id;
}
const missedSet = s => s.r != null && s.tr ? (s.amrap ? s.r < s.tr : s.r < (s.trMin || s.tr)) : false;
function curLiveSet(el) { const e = L.ex[+el.dataset.ei]; return {e, s:e.sets[+el.dataset.si]}; }
function saveWorkout() {
  const p = prog(), ps = pos();
  const ex = L.ex.map(e => ({ex:e.ex, sets:e.sets.filter(s => s.done).map(s => Object.assign({w:s.w != null ? s.w : (s.tw || 0), r:s.r != null ? s.r : (s.tr || 0), t:s.tr || 0, amrap:!!s.amrap, warm:!!s.warm}, s.eff ? {e:s.eff} : {}))})).filter(e => e.sets.length);
  if (!ex.length && !confirm('Nothing is checked off. Skip this day without logging?')) return;
  if (ex.length) {
    S.sessions.unshift({id:uid('s'), date:Date.now(), programId:p.id, program:p.name, day:p.days[ps.day].name, week:p.wave ? ps.week : null, cycle:ps.cycle,
      dur:L.started ? Math.max(1, Math.round((Date.now() - L.started) / 60000)) : null, note:(L.note || '').trim(), ex});
    S.dirtySinceBackup = (S.dirtySinceBackup || 0) + 1;
    const logged = new Set(ex.map(e => e.ex));
    p.days[ps.day].items.forEach(it => { if (it.next && logged.has(it.ex)) delete it.next; });
  }
  const finishedCycle = ps.cycle;
  let cycleDone = false;
  ps.day++;
  if (ps.day >= p.days.length) { ps.day = 0; if (p.wave) { ps.week++; if (ps.week >= WAVE.length) { ps.week = 0; ps.cycle++; cycleDone = true; } } }
  S.live = null; L = null; stopRest(); keepAwake(false);
  save(true); closeSheet(); render();
  toast(ex.length ? 'Workout saved.' : 'Day skipped.');
  if (cycleDone) setTimeout(() => tmReviewSheet(p, finishedCycle), 400);
}

/* After a training max changes, re-figure any sets in today's workout that are not checked off yet. */
function refreshLiveTm(p, exId) {
  if (!S.live || p.id !== S.active) return;
  const ps = pos(), fresh = buildEntries(p, p.days[ps.day], ps.week);
  /* nothing checked off yet: just rebuild today from the new numbers */
  if (!S.live.ex.some(e => e.sets.some(x => x.done))) { const note = S.live.note, started = S.live.started; S.live = null; const nl = buildLive(); nl.note = note; nl.started = started; S.live = nl; L = nl; return; }
  S.live.ex.forEach(e => {
    if (!e.kind) e.kind = e.main ? 'main' : 'reps';   // workouts started on versions before 3.2
    if (e.ex !== exId || !(e.kind === 'main' || TM_TYPES[e.kind])) return;
    const f = fresh.find(x => x.ex === exId && x.kind === e.kind); if (!f) return;
    e.sets = e.sets.map((st, i) => st.done || !f.sets[i] ? st : f.sets[i]);
    for (let i = e.sets.length; i < f.sets.length; i++) e.sets.push(f.sets[i]);
  });
}
